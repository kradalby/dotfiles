name: build into tsnixcache
description: Join the tailnet, install nix, build store paths and push their closures.

inputs:
  paths-command:
    description: Shell printing the store paths to push on stdout. Build logs go to stderr.
    required: true
  ts-oauth-client-id:
    description: Tailscale OAuth client id. Composite actions cannot read secrets themselves.
    required: true
  ts-oauth-secret:
    description: Tailscale OAuth client secret.
    required: true
  cache-url:
    description: tsnixcache base URL, read by both watch and push.
    default: http://tsnixcache
  extra-nix-conf:
    description: Extra nix.conf lines for this job only.
    default: ""

runs:
  using: composite
  steps:
    # Must precede nix: tsnixcache is tailnet-only, so the node has to be on the
    # tailnet before nix.conf names it. tag:github-builder carries the push grant.
    - name: Join tailnet
      uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:github-builder

    # access-tokens: resolving github: flake refs goes through the GitHub API,
    # which is 60/hour per IP unauthenticated — seven jobs exhaust that and get
    # a 403 mid-run.
    - name: Install Nix
      uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # main
      with:
        extra-conf: |
          extra-substituters = ${{ inputs.cache-url }}?priority=30 https://nixos-raspberrypi.cachix.org
          extra-trusted-public-keys = tsnixcache:Chid5Mll6U8ZUCio/j4KqxgtIeqPxH8Duqpz96TU4Es= nixos-raspberrypi.cachix.org-1:4iMO9LXa8BqhU+Rpg6LQKiGa2lsNh/j2oiYLNOQ5sPI=
          connect-timeout = 5
          fallback = true
          access-tokens = github.com=${{ github.token }}
          ${{ inputs.extra-nix-conf }}

    # Two pins: the SHA-pinned action passes CLI flags to a binary it downloads
    # separately, so `version` must move with it. Filter keeps cache.nixos.org
    # paths out of the 10 GB repo-wide quota.
    - name: Setup Nix cache
      uses: Mic92/hestia@69707ea4f233a235c599e3ffedd98955b9d1d6ff # v3.1.0
      with:
        version: v3.0.1
        upstream-cache-filter: "true"

    # Resolved from this repo's flake lock, so CI and the fleet run one build and
    # a `nix flake update` moves both together. Private session dir: the watcher
    # refuses a pid file whose directory is group- or world-readable.
    #
    # Streams paths as they land, so a build that dies late still leaves its
    # dependencies cached. No --idle-exit: a slow build goes quiet for longer
    # than any sane window, and an exited watcher stops streaming silently.
    # Redirected and disowned, not a bare `&`: the step's shell exits at once
    # and a watcher still writing to its log pipe takes SIGPIPE.
    - name: Start cache watcher
      shell: bash
      env:
        TSNIXCACHE_URL: ${{ inputs.cache-url }}
      run: |
        set -euo pipefail
        session=$(mktemp -d "${RUNNER_TEMP:-/tmp}/tsnixcache.XXXXXX")
        chmod 700 "$session"
        cache=$(nix build --no-link --print-out-paths --inputs-from . 'tsnixcache#default')/bin/tsnixcache
        echo "TSNIXCACHE_SESSION_DIR=$session" >> "$GITHUB_ENV"
        echo "TSNIXCACHE_BIN=$cache" >> "$GITHUB_ENV"
        "$cache" watch --to "$TSNIXCACHE_URL" \
          --state-dir "$session/state" \
          --pid-file "$session/watch.pid" \
          --drain-timeout 0 \
          > "$session/watch.log" 2>&1 &
        disown
        token=$("$cache" wait-for --ready --timeout 60s --pid-file "$session/watch.pid")
        echo "TSNIXCACHE_SESSION=$token" >> "$GITHUB_ENV"

    # Braced: a multi-line paths-command ends in a newline, which would strand
    # the redirect on its own line. The push backstops the watcher, which only
    # sees paths this job built — a substituted dependency never reaches it.
    # `-- -` reads stdin; ff drops a bare `-` ahead of other operands.
    - name: Build and push
      shell: bash
      env:
        TSNIXCACHE_URL: ${{ inputs.cache-url }}
      run: |
        set -euo pipefail
        {
          ${{ inputs.paths-command }}
        } > "$TSNIXCACHE_SESSION_DIR/paths"
        "$TSNIXCACHE_BIN" push --to "$TSNIXCACHE_URL" -- - < "$TSNIXCACHE_SESSION_DIR/paths"

    # --stop asks the watcher to drain what is queued and exit, so a failed build
    # still ships what it did manage to build. --timeout 0 because the timeout
    # bounds the whole final upload, and a real closure does not drain inside any
    # fixed window; the job timeout is the outer bound. No PID file means the
    # watcher died; the log says why.
    - name: Drain cache uploads
      if: always()
      shell: bash
      env:
        TSNIXCACHE_URL: ${{ inputs.cache-url }}
      run: |
        if [ -n "${TSNIXCACHE_SESSION_DIR:-}" ] && [ -f "$TSNIXCACHE_SESSION_DIR/watch.pid" ]; then
          "$TSNIXCACHE_BIN" wait-for --stop \
            --pid-file "$TSNIXCACHE_SESSION_DIR/watch.pid" \
            --pid-file-timeout 10s \
            --timeout 0 \
            ${TSNIXCACHE_SESSION:+--session "$TSNIXCACHE_SESSION"}
        fi
        cat "${TSNIXCACHE_SESSION_DIR:-}/watch.log" 2>/dev/null || echo "watcher wrote no log"
