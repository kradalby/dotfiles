# promtool unit tests over the FULL rendered rule set: the inline rules from
# machines/core.oracldn/monitoring.nix plus the sloth-generated burn-rate
# rules. Substituted paths come from checks/prometheus-rules/default.nix.
rule_files:
  - "@rules@"
  - "@sloth@"

evaluation_interval: 1m

tests:
  - name: Smokeping annotations identify the destination rather than the exporter
    interval: 1m
    input_series:
    - series: smokeping_requests_total{job="smokeping",instance="core-tjoda:9374",host="core-tjoda",target="core-tjoda",tos="0",exported_host="core-oracldn.dalby.ts.net",ip="100.74.41.5"}
      values: 0+60x40
    - series: smokeping_response_duration_seconds_count{job="smokeping",instance="core-tjoda:9374",host="core-tjoda",target="core-tjoda",tos="0",exported_host="core-oracldn.dalby.ts.net",ip="100.74.41.5"}
      values: 0+0x40
    - series: smokeping_requests_total{job="smokeping",instance="core-tjoda:9374",host="core-tjoda",target="core-tjoda",tos="0",exported_host="8.8.8.8",ip="8.8.8.8"}
      values: 0+60x40
    - series: smokeping_response_duration_seconds_count{job="smokeping",instance="core-tjoda:9374",host="core-tjoda",target="core-tjoda",tos="0",exported_host="8.8.8.8",ip="8.8.8.8"}
      values: 0+48x40
    - series: smokeping_requests_total{job="smokeping",instance="core-tjoda:9374",host="core-tjoda",target="core-tjoda",tos="0",exported_host="1.1.1.1",ip="1.1.1.1"}
      values: 0+60x40
    - series: smokeping_response_duration_seconds_count{job="smokeping",instance="core-tjoda:9374",host="core-tjoda",target="core-tjoda",tos="0",exported_host="1.1.1.1",ip="1.1.1.1"}
      values: 0+60x40
    alert_rule_test:
    - eval_time: 10m
      alertname: SmokepingPacketLoss
      exp_alerts: []
    - eval_time: 25m
      alertname: SmokepingPacketLoss
      exp_alerts:
      - exp_labels:
          job: smokeping
          instance: core-tjoda:9374
          host: core-tjoda
          target: core-tjoda
          tos: '0'
          exported_host: core-oracldn.dalby.ts.net
          ip: 100.74.41.5
          severity: warning
        exp_annotations:
          summary: Packet loss >10% to core-oracldn.dalby.ts.net from core-tjoda:9374
          description: Smokeping is detecting sustained packet loss to core-oracldn.dalby.ts.net.
      - exp_labels:
          job: smokeping
          instance: core-tjoda:9374
          host: core-tjoda
          target: core-tjoda
          tos: '0'
          exported_host: 8.8.8.8
          ip: 8.8.8.8
          severity: warning
        exp_annotations:
          summary: Packet loss >10% to 8.8.8.8 from core-tjoda:9374
          description: Smokeping is detecting sustained packet loss to 8.8.8.8.
    - eval_time: 10m
      alertname: SmokepingTargetDown
      exp_alerts: []
    - eval_time: 25m
      alertname: SmokepingTargetDown
      exp_alerts:
      - exp_labels:
          job: smokeping
          instance: core-tjoda:9374
          host: core-tjoda
          target: core-tjoda
          tos: '0'
          exported_host: core-oracldn.dalby.ts.net
          ip: 100.74.41.5
          severity: critical
        exp_annotations:
          summary: 100% packet loss to core-oracldn.dalby.ts.net from core-tjoda:9374
          description: Smokeping is detecting complete packet loss to core-oracldn.dalby.ts.net for more than 15 minutes.

  - name: Watchdog and email successes cannot mask Discord delivery failures
    interval: 1m
    input_series:
      - series: 'alertmanager_notifications_total{job="alertmanager", instance="localhost:9093", integration="discord"}'
        values: "0+2x120"
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="localhost:9093", integration="discord", reason="clientError"}'
        values: "0+1x120"
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="localhost:9093", integration="discord", reason="serverError"}'
        values: "0+1x120"
      - series: 'alertmanager_notifications_total{job="alertmanager", instance="localhost:9093", integration="email"}'
        values: "0+100x120"
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="localhost:9093", integration="email", reason="other"}'
        values: "0x120"
      - series: 'alertmanager_notifications_total{job="alertmanager", instance="localhost:9093", integration="webhook"}'
        values: "0+1000x120"
      - series: 'alertmanager_notifications_failed_total{job="alertmanager", instance="localhost:9093", integration="webhook", reason="other"}'
        values: "0x120"
    promql_expr_test:
      - expr: 'slo:sli_error:ratio_rate5m{sloth_slo="alertmanager-delivery"}'
        eval_time: 30m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{cluster="homelab", integration="discord", sloth_id="homelab-alertmanager-delivery", sloth_service="homelab", sloth_slo="alertmanager-delivery", sloth_window="5m"}'
            value: 1
          - labels: 'slo:sli_error:ratio_rate5m{cluster="homelab", integration="email", sloth_id="homelab-alertmanager-delivery", sloth_service="homelab", sloth_slo="alertmanager-delivery", sloth_window="5m"}'
            value: 0
    alert_rule_test:
      - eval_time: 30m
        alertname: AlertmanagerDeliveryErrorBudgetBurn
        exp_alerts:
          - exp_labels:
              cluster: homelab
              integration: discord
              sloth_id: homelab-alertmanager-delivery
              sloth_service: homelab
              sloth_slo: alertmanager-delivery
              severity: critical
              sloth_severity: page
            exp_annotations:
              summary: "AlertmanagerDeliveryErrorBudgetBurn: burning error budget too fast"
              title: "(page) homelab alertmanager-delivery SLO error budget burn rate is too fast."
          - exp_labels:
              cluster: homelab
              integration: discord
              sloth_id: homelab-alertmanager-delivery
              sloth_service: homelab
              sloth_slo: alertmanager-delivery
              severity: warning
              sloth_severity: ticket
            exp_annotations:
              summary: "AlertmanagerDeliveryErrorBudgetBurn: burning error budget too fast"
              title: "(ticket) homelab alertmanager-delivery SLO error budget burn rate is too fast."

  - name: Missing Incus guests retain their backing labels
    interval: 1m
    input_series:
      - series: 'incus_memory_MemTotal_bytes{job="incus", instance="core-ldn:8443", host="core-ldn", name="dev"}'
        values: "1000x30"
      - series: 'incus_memory_MemTotal_bytes{job="incus", instance="core-ldn:8443", host="core-ldn", name="home"}'
        values: "1000x30"
      - series: 'incus_memory_MemTotal_bytes{job="incus", instance="core-ldn:8443", host="core-ldn", name="storage"}'
        values: "1000x30"
      - series: 'incus_memory_MemTotal_bytes{job="incus", instance="gigabuilder:8443", host="gigabuilder", name="garnix"}'
        values: "1000x30"
      # A guest with the same name on a different hypervisor cannot mask ts1p.
      - series: 'incus_memory_MemTotal_bytes{job="incus", instance="gigabuilder:8443", host="gigabuilder", name="ts1p"}'
        values: "1000x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: IncusVMVanished
        exp_alerts: []
      - eval_time: 20m
        alertname: IncusVMVanished
        exp_alerts:
          - exp_labels:
              severity: critical
              name: ts1p
              job: incus
              instance: core-ldn:8443
              host: core-ldn
              target: core-ldn
              hypervisor: core-ldn
            exp_annotations:
              summary: "Incus VM ts1p has vanished from hypervisor metrics"
              description: "The VM no longer reports from its hypervisor — stopped, deleted, or renamed."

  - name: Litestream missing metrics are per scrape
    interval: 1m
    input_series:
      - series: 'up{job="litestream", instance="core-oracldn:54909", host="core-oracldn", target="core-oracldn"}'
        values: "1x30"
      - series: 'up{job="litestream", instance="dev-oracfurt:54909", host="dev-oracfurt", target="dev-oracfurt"}'
        values: "1x30"
      - series: 'up{job="litestream", instance="down:54909", host="down", target="down"}'
        values: "0x30"
      - series: 'litestream_sync_count{job="litestream", instance="dev-oracfurt:54909", db="golink.db"}'
        values: "0+1x30"
      # The same address in a different job must not satisfy the canary.
      - series: 'litestream_sync_count{job="other", instance="core-oracldn:54909", db="kuma.db"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: LitestreamMetricsMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: LitestreamMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: litestream
              instance: core-oracldn:54909
              host: core-oracldn
              target: core-oracldn
            exp_annotations:
              summary: "Litestream exporter on core-oracldn:54909 is up but litestream_sync_count is absent"
              description: "Litestream sync metrics disappeared on this host (metric rename or database configuration failure); its replication alerts are blind."

  - name: A healthy laptop cannot mask its missing peer
    interval: 30m
    input_series:
      - series: 'rustic_backup_last_snapshot_timestamp_seconds{job="rustic", instance="krair", host="krair"}'
        values: "0+1800x16"
    alert_rule_test:
      - eval_time: 5h
        alertname: RusticBackupMetricsMissing
        exp_alerts: []
      - eval_time: 7h
        alertname: RusticBackupMetricsMissing
        exp_alerts:
          - exp_labels:
              host: kratail2
              severity: warning
            exp_annotations:
              summary: "No rustic backup timestamp for kratail2"
              description: "rustic_backup_last_snapshot_timestamp_seconds is absent for this configured laptop; its backup dead-man is blind."

  - name: Both configured laptops retain missing coverage
    interval: 30m
    input_series:
      - series: 'rustic_backup_last_snapshot_timestamp_seconds{job="rustic", instance="kratail2", host="kratail2"}'
        values: "0+1800x16"
    alert_rule_test:
      - eval_time: 7h
        alertname: RusticBackupMetricsMissing
        exp_alerts:
          - exp_labels:
              host: krair
              severity: warning
            exp_annotations:
              summary: "No rustic backup timestamp for krair"
              description: "rustic_backup_last_snapshot_timestamp_seconds is absent for this configured laptop; its backup dead-man is blind."

  - name: Persisted offline laptop metrics use the staleness alert
    interval: 1m
    input_series:
      - series: 'rustic_backup_last_snapshot_timestamp_seconds{job="rustic", instance="krair", host="krair"}'
        values: "0+60x60"
      - series: 'rustic_backup_last_snapshot_timestamp_seconds{job="rustic", instance="kratail2", host="kratail2"}'
        values: "-300000x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: RusticBackupMetricsMissing
        exp_alerts: []
      - eval_time: 40m
        alertname: RusticBackupStale
        exp_alerts:
          - exp_labels:
              job: rustic
              instance: kratail2
              host: kratail2
              severity: warning
            exp_annotations:
              summary: "rustic backup on kratail2 is stale (>3d)"
              description: "No fresh rustic snapshot for over three days; the laptop's backups have silently stopped."

  - name: An OCI account failing from startup cannot hide behind a healthy account
    interval: 1m
    input_series:
      - series: 'up{job="oci-usage", instance="localhost:63461", host="localhost", target="core-oracldn"}'
        values: "1x120"
      - series: 'oci_usage_up{job="oci-usage", instance="localhost:63461", host="localhost", target="core-oracldn", account="kradalby"}'
        values: "1x120"
      - series: 'oci_usage_month_total{job="oci-usage", instance="localhost:63461", account="kradalby"}'
        values: "0x120"
      - series: 'oci_usage_up{job="oci-usage", instance="localhost:63461", host="localhost", target="core-oracldn", account="vsdalby"}'
        values: "0x120"
      - series: 'up{job="oci-usage", instance="down:63461"}'
        values: "0x120"
      - series: 'oci_usage_up{job="oci-usage", instance="down:63461", account="vsdalby"}'
        values: "0x120"
    alert_rule_test:
      - eval_time: 50m
        alertname: OracleUsageMetricsMissing
        exp_alerts: []
      - eval_time: 70m
        alertname: OracleUsageMetricsMissing
        exp_alerts:
          - exp_labels:
              account: vsdalby
              job: oci-usage
              instance: localhost:63461
              host: localhost
              target: core-oracldn
              severity: warning
            exp_annotations:
              summary: "OCI usage metrics missing for vsdalby on localhost:63461"
              description: "oci_usage_month_total is absent for this account or scrape while the exporter is up; the Oracle cost and staleness alerts are blind."

  # PostgreSQL slots are shared by active and idle client connections across
  # databases and users. Other backends and other servers do not share slots.
  - name: PostgreSQL connection totals per server
    interval: 1m
    input_series:
      - series: 'pg_stat_activity_count{job="postgres", instance="core-oracldn:9187", host="core-oracldn", target="core-oracldn", server="/run/postgresql:5432", datname="umami", state="active", usename="umami", application_name="web", backend_type="client backend", wait_event_type="", wait_event=""}'
        values: "45x20"
      - series: 'pg_stat_activity_count{job="postgres", instance="core-oracldn:9187", host="core-oracldn", target="core-oracldn", server="/run/postgresql:5432", datname="postgres", state="idle", usename="postgres", application_name="", backend_type="client backend", wait_event_type="Client", wait_event="ClientRead"}'
        values: "50x20"
      - series: 'pg_stat_activity_count{job="postgres", instance="garnix:9187", host="garnix", target="garnix", hypervisor="gigabuilder", server="/run/postgresql:5432", datname="garnix", state="active", backend_type="client backend"}'
        values: "40x20"
      - series: 'pg_stat_activity_count{job="postgres", instance="garnix:9187", host="garnix", target="garnix", hypervisor="gigabuilder", server="/run/postgresql:5432", datname="garnix", state="idle", backend_type="client backend"}'
        values: "40x20"
      - series: 'pg_stat_activity_count{job="postgres", instance="garnix:9187", host="garnix", target="garnix", hypervisor="gigabuilder", server="/run/postgresql:5432", datname="garnix", state="active", backend_type="parallel worker"}'
        values: "10x20"
    alert_rule_test:
      - eval_time: 4m
        alertname: PostgreSQLHighConnections
        exp_alerts: []
      - eval_time: 10m
        alertname: PostgreSQLHighConnections
        exp_alerts:
          - exp_labels:
              severity: warning
              job: postgres
              instance: core-oracldn:9187
              host: core-oracldn
              target: core-oracldn
              server: /run/postgresql:5432
            exp_annotations:
              summary: "PostgreSQL connections high on core-oracldn:9187: 95"
              description: "PostgreSQL on core-oracldn:9187 has more than 80 client connections (default max is 100)."

  # A live process is insufficient: the relay must be connected and the
  # protocol probe must keep updating its timestamp.
  - interval: 1m
    input_series:
      - series: 'codex_remote_control_probe_success{host="dev-ldn", instance="dev-ldn:9100", job="nodes"}'
        values: "1x20"
      - series: 'codex_remote_control_probe_timestamp_seconds{host="dev-ldn", instance="dev-ldn:9100", job="nodes"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: CodexRemoteControlUnavailable
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'codex_remote_control_probe_success{host="dev-ldn", instance="dev-ldn:9100", job="nodes"}'
        values: "0x20"
      - series: 'codex_remote_control_probe_timestamp_seconds{host="dev-ldn", instance="dev-ldn:9100", job="nodes"}'
        values: "0+60x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: CodexRemoteControlUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              host: dev-ldn
              instance: dev-ldn:9100
              job: nodes
            exp_annotations:
              summary: "Codex remote control is unavailable on dev-ldn"
              description: "The Codex app-server probe is disconnected, stale, or missing. Check codex-remote-control.service, its health timer, and the user's Codex login."
  - interval: 1m
    input_series:
      - series: 'codex_remote_control_probe_success{host="dev-ldn", instance="dev-ldn:9100", job="nodes"}'
        values: "1x20"
      - series: 'codex_remote_control_probe_timestamp_seconds{host="dev-ldn", instance="dev-ldn:9100", job="nodes"}'
        values: "0x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: CodexRemoteControlUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              host: dev-ldn
              instance: dev-ldn:9100
              job: nodes
            exp_annotations:
              summary: "Codex remote control is unavailable on dev-ldn"
              description: "The Codex app-server probe is disconnected, stale, or missing. Check codex-remote-control.service, its health timer, and the user's Codex login."
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 10m
        alertname: CodexRemoteControlUnavailable
        exp_alerts:
          - exp_labels:
              severity: warning
              host: dev-ldn
            exp_annotations:
              summary: "Codex remote control is unavailable on dev-ldn"
              description: "The Codex app-server probe is disconnected, stale, or missing. Check codex-remote-control.service, its health timer, and the user's Codex login."
  # Host-dead vs exporter-broken split: h1 answers ping (scrape broken),
  # h2 does not (host down). Each fires exactly one of the pair.
  - interval: 1m
    input_series:
      - series: 'up{job="nodes", instance="h1:9100", host="h1"}'
        values: "0x30"
      - series: 'probe_success{job="tailnet-ping", instance="h1", host="h1"}'
        values: "1x30"
      - series: 'up{job="nodes", instance="h2:9100", host="h2"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: HostUpScrapeBroken
        exp_alerts:
          - exp_labels:
              severity: warning
              job: nodes
              instance: h1:9100
              host: h1
            exp_annotations:
              summary: "h1 answers ping but its node exporter is unreachable"
              description: "The host is alive but the scrape fails — exporter crashed or a firewall change closed the port (check interfaces.tailscale0.allowedTCPPorts)."
      - eval_time: 10m
        alertname: NodeExporterDown
        exp_alerts:
          - exp_labels:
              severity: critical
              job: nodes
              instance: h2:9100
              host: h2
            exp_annotations:
              summary: "Host h2 is unreachable"
              description: "Node exporter is down and the host does not answer ping over the tailnet. Is it powered on? Is Tailscale running?"

  # Oneshot backup units report "activating" for their whole runtime: they
  # must NOT trip the 5m stuck-unit alert, only the 6h fuse.
  - interval: 1m
    input_series:
      - series: 'systemd_unit_state{state="activating", name="restic-backups-tjoda.service", instance="h1:9558", host="h1"}'
        values: "1x400"
      - series: 'systemd_unit_state{state="activating", name="wedged.service", instance="h1:9558", host="h1"}'
        values: "1x400"
      # BackupJobRunningTooLong ages the run from its timer, not from how long
      # the unit has been activating. tjoda's timer fired at t=0, so at 370m the
      # run really is 6h old and must alert.
      - series: 'systemd_timer_last_trigger_seconds{name="restic-backups-tjoda.timer", instance="h1:9558", host="h1"}'
        values: "0x400"
      # The back-to-back case the `for` clock got wrong: activating unbroken for
      # the whole window, but the timer re-fired at 350m, so no single run is
      # anywhere near 6h. It must stay silent — the 370m exp_alerts below lists
      # every alert expected, so this firing would fail the test.
      - series: 'systemd_unit_state{state="activating", name="restic-backups-hourly.service", instance="h1:9558", host="h1"}'
        values: "1x400"
      - series: 'systemd_timer_last_trigger_seconds{name="restic-backups-hourly.timer", instance="h1:9558", host="h1"}'
        values: "21000x400"
    alert_rule_test:
      - eval_time: 10m
        alertname: SystemdUnitActivatingTooLong
        exp_alerts:
          - exp_labels:
              severity: warning
              state: activating
              name: wedged.service
              instance: h1:9558
              host: h1
            exp_annotations:
              summary: "h1: unit wedged.service stuck activating"
              description: "The systemd unit wedged.service has been in activating state for more than 5 minutes."
      - eval_time: 370m
        alertname: BackupJobRunningTooLong
        exp_alerts:
          - exp_labels:
              severity: warning
              state: activating
              name: restic-backups-tjoda.service
              instance: h1:9558
              host: h1
            exp_annotations:
              summary: "h1: backup job restic-backups-tjoda.service running for over 6h"
              description: "A backup unit has been running far longer than any normal upload; it is probably wedged."

  # Backup TRUTH: a success timestamp that stops advancing pages after 3h
  # (26h grace for jotta — not yet stale at 4h, stale at 9h).
  - interval: 1m
    input_series:
      - series: 'restic_backup_last_success_timestamp_seconds{repo="tjoda", instance="h1", job="restic"}'
        values: "60x540"
      - series: 'restic_backup_last_success_timestamp_seconds{repo="jotta", instance="h1", job="restic"}'
        values: "60x540"
    alert_rule_test:
      - eval_time: 240m
        alertname: ResticBackupNotSucceeding
        exp_alerts:
          - exp_labels:
              severity: critical
              repo: tjoda
              instance: h1
              job: restic
            exp_annotations:
              summary: "Restic tjoda on h1: no successful backup for 3h"
              description: "The backup unit is firing but not completing successfully (hourly schedule expected). Check the unit log; ServiceFailed may have details."
      - eval_time: 240m
        alertname: ResticBackupNotSucceedingJotta
        exp_alerts: []
      - eval_time: 540m
        alertname: ResticBackupNotSucceedingJotta
        exp_alerts:
          - exp_labels:
              severity: critical
              repo: jotta
              instance: h1
              job: restic
            exp_annotations:
              summary: "Restic jotta on h1: no successful offsite backup for 8h"
              description: "The Jottacloud job is the only offsite copy of /storage; slow rclone uploads get 8h of slack, silence beyond that is real."

  # Jotta proxy: a failed VIP probe pages after 15m.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="restic-jotta-probe", instance="http://restic-jotta.dalby.ts.net"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ResticJottaProxyDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: restic-jotta-probe
              instance: http://restic-jotta.dalby.ts.net
            exp_annotations:
              summary: "Jotta restic proxy is not answering on its VIP"
              description: "restic-jotta.dalby.ts.net is unreachable: rclone-jotta.service on core.tjoda is down, the VIP advertisement broke, or the grant changed. Every host's offsite backup fails until this is back."

  # Jotta proxy traffic cross-check: proxy up with a frozen transfer counter
  # fires (and the canary stays quiet — the series exists). A counter that
  # never moves has increase()==0 over any partial window, so a short series
  # exercises the 26h rule.
  - interval: 1m
    input_series:
      - series: 'rclone_bytes_transferred_total{job="rclone-jotta", instance="core-tjoda:56901", host="core-tjoda"}'
        values: "100x200"
      - series: 'up{job="rclone-jotta", instance="core-tjoda:56901", host="core-tjoda"}'
        values: "1x200"
    alert_rule_test:
      - eval_time: 2h
        alertname: ResticJottaProxyNoTraffic
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No bytes moved through the Jotta restic proxy in 26h"
              description: "The proxy is up but no client backup has pushed data through it for over a day; check the client jotta jobs and the token-check unit on core.tjoda."
      - eval_time: 2h
        alertname: ResticJottaProxyMetricsMissing
        exp_alerts: []

  # Jotta proxy metric-rename canary: scrape up, expected series absent → page.
  - interval: 1m
    input_series:
      - series: 'up{job="rclone-jotta", instance="core-tjoda:56901", host="core-tjoda"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: ResticJottaProxyMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Jotta proxy scrape is up but rclone_bytes_transferred_total is absent"
              description: "The rclone metric names have changed (version bump?); ResticJottaProxyNoTraffic is blind until the rules are updated."
      - eval_time: 20m
        alertname: ResticJottaProxyNoTraffic
        exp_alerts: []

  # Litestream: sync errors page; and the sloth SLI records the right ratio
  # (1 error/min against 2 ops/min = 0.5).
  - interval: 1m
    input_series:
      - series: 'litestream_sync_error_count{db="kuma.db", instance="core-oracldn:54909", job="litestream"}'
        values: "0+1x120"
      - series: 'litestream_sync_count{db="kuma.db", instance="core-oracldn:54909", job="litestream"}'
        values: "0+2x120"
    alert_rule_test:
      - eval_time: 30m
        alertname: LitestreamSyncErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              target: core-tjoda
              db: kuma.db
              instance: core-oracldn:54909
              job: litestream
            exp_annotations:
              summary: "Litestream local sync failing for kuma.db"
              description: "Litestream cannot sync the local database kuma.db; replication is stalled."
    promql_expr_test:
      - expr: 'sum(slo:sli_error:ratio_rate5m{sloth_slo="litestream-sync"})'
        eval_time: 30m
        exp_samples:
          - value: 0.5

  # Metric-rename canary: exporter up, expected series absent → page. This is
  # the guard against the litestream_replica_lag_seconds class of dead rule.
  - interval: 1m
    input_series:
      - series: 'up{job="litestream", instance="core-oracldn:54909", host="core-oracldn"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: LitestreamMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              job: litestream
              instance: core-oracldn:54909
              host: core-oracldn
            exp_annotations:
              summary: "Litestream exporter on core-oracldn:54909 is up but litestream_sync_count is absent"
              description: "Litestream sync metrics disappeared on this host (metric rename or database configuration failure); its replication alerts are blind."

  # ghdl per-source freshness: last_success frozen while the exporter stays up
  # → stale after 36h. Fresh at 100m, stale at 2220m.
  - interval: 1m
    input_series:
      - series: 'ghdl_last_success_timestamp{source="ghcr", instance="ghdl:80", job="ghdl"}'
        values: "0x2400"
      - series: 'up{job="ghdl", instance="ghdl:80", host="ghdl"}'
        values: "1x2400"
    alert_rule_test:
      - eval_time: 100m
        alertname: GhdlScrapeStale
        exp_alerts: []
      - eval_time: 2280m
        alertname: GhdlScrapeStale
        exp_alerts:
          - exp_labels:
              severity: warning
              source: ghcr
              instance: ghdl:80
              job: ghdl
            exp_annotations:
              summary: "ghdl source ghcr is stale"
              description: "ghdl has not had a successful ghcr collection in over 36h. The source API or scrape may have broken."

  # ghdl metric-rename canary: scrape up, expected series absent → page.
  - interval: 1m
    input_series:
      - series: 'up{job="ghdl", instance="ghdl:80", host="ghdl"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: GhdlMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "ghdl is up but ghdl_last_success_timestamp is absent"
              description: "The ghdl metric names changed (version bump?), or no collection has ever succeeded. All ghdl freshness alerts are blind until fixed."

  # The dead-man heartbeat must always be firing.
  - interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: Watchdog
        exp_alerts:
          - exp_labels:
              severity: heartbeat
            exp_annotations:
              summary: "Dead-man heartbeat"
              description: "Always firing. If healthchecks.io stops receiving this, Prometheus, Alertmanager, or the delivery path is down."

  # Exporter up + zero messages flowing = the zigbee "empty broker" class.
  - interval: 1m
    input_series:
      - series: 'sensor_message_total{sensor="zigbee2mqtt/kitchen", instance="home-ldn:9000", job="mqtt"}'
        values: "5x120"
    alert_rule_test:
      - eval_time: 45m
        alertname: SensorPipelineSilent
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "No zigbee sensor messages for over an hour"
              description: "mqtt-exporter on home-ldn is not seeing any messages; zigbee2mqtt, its broker, or the exporter subscription is broken."

  # The dead-man's egress path is watched by the still-alive pipeline: no route
  # to hc-ping.com (the healthchecks.io ping host) pages via Discord (warning)
  # before the missed ping.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="deadman-transport", instance="https://hc-ping.com"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: DeadmanNotifierUnreachable
        exp_alerts:
          - exp_labels:
              severity: warning
              job: deadman-transport
              instance: https://hc-ping.com
            exp_annotations:
              summary: "core.oracldn cannot reach hc-ping.com"
              description: "The Watchdog and litestream heartbeat cannot ping the out-of-band dead-man; if the pipeline dies now, nothing will notice. Check egress/DNS, or healthchecks.io status."

  # Oracle cloud spend: usage that stops refreshing goes stale after 3h (fresh
  # at 4m, stale at 4h with the timestamp frozen at 60).
  - interval: 1m
    input_series:
      - series: 'oci_usage_month_total{account="prod", instance="localhost:63461", job="oci-usage"}'
        values: "0x540"
      - series: 'oci_usage_last_success_seconds{account="prod", instance="localhost:63461", job="oci-usage"}'
        values: "60x540"
      - series: 'up{job="oci-usage", instance="localhost:63461", host="localhost"}'
        values: "1x540"
    alert_rule_test:
      - eval_time: 4m
        alertname: OracleCostNonZero
        exp_alerts: []
      - eval_time: 240m
        alertname: OracleUsageStale
        exp_alerts:
          - exp_labels:
              severity: warning
              account: prod
              instance: localhost:63461
              job: oci-usage
            exp_annotations:
              summary: "Oracle usage data for prod is stale"
              description: "The OCI usage exporter has not had a successful usage query for account prod in over 3 hours."

  # Any nonzero month total is a departure from the Always Free tier → critical.
  - interval: 1m
    input_series:
      - series: 'oci_usage_month_total{account="prod", instance="localhost:63461", job="oci-usage"}'
        values: "5x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: OracleCostNonZero
        exp_alerts:
          - exp_labels:
              severity: critical
              account: prod
              instance: localhost:63461
              job: oci-usage
            exp_annotations:
              summary: "Oracle account prod has spent 5 this month"
              description: "Oracle Cloud account prod reports nonzero cost this month; something has left the Always Free tier."

  # Metric-rename canary: exporter up, oci_usage_month_total absent → the cost
  # alert is blind, so page. Guards the same class as LitestreamMetricsMissing.
  - interval: 1m
    input_series:
      - series: 'up{job="oci-usage", instance="localhost:63461", host="localhost"}'
        values: "1x120"
    alert_rule_test:
      - eval_time: 70m
        alertname: OracleUsageMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
              job: oci-usage
              instance: localhost:63461
              host: localhost
            exp_annotations:
              summary: "OCI usage metrics missing on localhost:63461"
              description: "oci_usage_month_total is absent for this account or scrape while the exporter is up; the Oracle cost and staleness alerts are blind."

  # litestream restore-test freshness: a last-success stamp far in the past
  # (>14d before now) pages. A large-negative epoch keeps the sample fresh at a
  # modest eval time instead of needing a 14-day series.
  - interval: 1m
    input_series:
      - series: "litestream_restore_test_last_success_seconds"
        values: "-1300000x120"
    alert_rule_test:
      - eval_time: 90m
        alertname: LitestreamRestoreStale
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Litestream has not passed a restore test in over two weeks"
              description: "The weekly restore + integrity check has not succeeded recently; the sqlite replicas may not be restorable. Check litestream-restore-test.service."

  # Textfile collector health: the one alert that would have caught the sanoid
  # 0600 bug and the missing-directory case fleet-wide.
  - interval: 1m
    input_series:
      - series: 'node_textfile_scrape_error{instance="h1:9100", host="h1"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: NodeTextfileCollectorErrors
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: h1:9100
              host: h1
            exp_annotations:
              summary: "h1:9100: node_exporter textfile collector scrape error"
              description: "node_exporter failed to read the textfile collector directory or a .prom file; textfile-backed metrics (ZFS snapshot/pool, litestream restore) are missing until fixed."

  # ZFS snapshot/pool alerts, unblocked now the sanoid textfile is readable. A
  # large-negative epoch keeps `time() - ts` past the 25h threshold at a modest
  # eval time (same trick as LitestreamRestoreStale above).
  - interval: 1m
    input_series:
      - series: 'zfs_snapshot_newest_creation_seconds{dataset="tank/data", instance="h1:9100", host="h1"}'
        values: "-100000x60"
      - series: 'zfs_pool_status_errors{pool="tank", instance="h1:9100", host="h1"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 40m
        alertname: ZfsSnapshotStale
        exp_alerts:
          - exp_labels:
              severity: warning
              dataset: tank/data
              instance: h1:9100
              host: h1
            exp_annotations:
              summary: "Newest snapshot of tank/data on h1 is stale"
              description: "sanoid has not produced a snapshot for over 25 hours; snapshotting has silently stalled."
      - eval_time: 20m
        alertname: ZpoolStatusErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              pool: tank
              instance: h1:9100
              host: h1
            exp_annotations:
              summary: "zpool status reports errors on tank (h1)"
              description: "The pool is accumulating checksum/scrub errors while staying ONLINE — zfs_pool_health alone does not catch this."

  # SmartctlDiskMissing is generated per host from metadata/smartctl.nix. Four
  # of core-tjoda's five disks reporting drops the count below 5 and pages.
  - interval: 1m
    input_series:
      - series: 'smartctl_device_smart_status{device="d1", host="core-tjoda", instance="core-tjoda:9633"}'
        values: "1x30"
      - series: 'smartctl_device_smart_status{device="d2", host="core-tjoda", instance="core-tjoda:9633"}'
        values: "1x30"
      - series: 'smartctl_device_smart_status{device="d3", host="core-tjoda", instance="core-tjoda:9633"}'
        values: "1x30"
      - series: 'smartctl_device_smart_status{device="d4", host="core-tjoda", instance="core-tjoda:9633"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: SmartctlDiskMissing
        exp_alerts:
          - exp_labels:
              severity: critical
              host: core-tjoda
            exp_annotations:
              summary: "core-tjoda: fewer than 5 disks report SMART"
              description: "A monitored disk (or the whole metric) disappeared from the smartctl exporter on core-tjoda — dead disk, dead controller, renamed metric, or metadata/smartctl.nix is stale."

  # ServiceFailed must ignore transient login scopes (the self-inflicted noise)
  # but still page on a real failed service.
  - interval: 1m
    input_series:
      - series: 'systemd_unit_state{state="failed", type="scope", name="session-c1.scope", instance="h1:9558", host="h1"}'
        values: "1x30"
      - series: 'systemd_unit_state{state="failed", type="service", name="real.service", instance="h1:9558", host="h1"}'
        values: "1x30"
    alert_rule_test:
      - eval_time: 10m
        alertname: ServiceFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              state: failed
              type: service
              name: real.service
              instance: h1:9558
              host: h1
            exp_annotations:
              summary: "h1:9558: service real.service failed"
              description: "The systemd unit real.service on h1:9558 has been in failed state for more than 2 minutes."

  # restic dead-man canary: the whole success-metric family disappearing must
  # page even though the per-repo staleness thresholds cannot. A present jotta
  # series with no local-repo series fires the repo!="jotta" disjunct.
  - interval: 1m
    input_series:
      - series: 'restic_backup_last_success_timestamp_seconds{repo="jotta", instance="h1", job="restic"}'
        values: "0x400"
    alert_rule_test:
      - eval_time: 380m
        alertname: ResticBackupMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "restic backup success metric is missing"
              description: "No restic_backup_last_success_timestamp_seconds series for one or more repo classes — metric renamed or pushgateway wiped, so ResticBackupNotSucceeding cannot fire."

  # IncusDaemonWarnings fires on NEW warnings (delta) and must clear once the
  # count stops rising — the old `> 0` pinned forever on one unacked warning.
  - interval: 1m
    input_series:
      - series: 'incus_warnings_total{instance="core-ldn:8443", host="core-ldn"}'
        values: "0x30 1x150"
    alert_rule_test:
      - eval_time: 55m
        alertname: IncusDaemonWarnings
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: core-ldn:8443
              host: core-ldn
            exp_annotations:
              summary: "New Incus warning(s) on core-ldn:8443"
              description: "The Incus daemon on core-ldn:8443 raised a new warning. Check 'incus warning list' (clear stale ones with 'incus warning delete')."
      # The same warning still unacked two hours later: no new rise, no alert.
      - eval_time: 170m
        alertname: IncusDaemonWarnings
        exp_alerts: []

  # SmartPlugTelemetryDown is scoped to homewizard (the only job with a real
  # probe_success); a dead tasmota-job series must not resurrect the old
  # can't-fire matcher.
  - interval: 1m
    input_series:
      - series: 'probe_success{job="homewizard", instance="power-p1-meter.ldn.fap.no"}'
        values: "0x30"
      - series: 'probe_success{job="tasmota", instance="office-light.ldn.fap.no"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 15m
        alertname: SmartPlugTelemetryDown
        exp_alerts:
          - exp_labels:
              severity: warning
              job: homewizard
              instance: power-p1-meter.ldn.fap.no
            exp_annotations:
              summary: "No response from power-p1-meter.ldn.fap.no"
              description: "P1 meter unreachable — device offline or the LDN subnet route is broken."

  # ResticBackupPartial: a full day of exit-3 (persistently unreadable path)
  # pages; interleaved clean runs (routine vanished-file churn) never do.
  - interval: 1m
    input_series:
      - series: 'restic_backup_last_exit_status{repo="tjoda", instance="dev-ldn", job="restic"}'
        values: "3x1560"
      - series: 'restic_backup_last_exit_status{repo="ldn", instance="dev-ldn", job="restic"}'
        values: "3x760 0 3x799"
    alert_rule_test:
      - eval_time: 1500m
        alertname: ResticBackupPartial
        exp_alerts:
          - exp_labels:
              severity: warning
              repo: tjoda
              instance: dev-ldn
              job: restic
            exp_annotations:
              summary: "Restic tjoda on dev-ldn: every backup partial for 24h"
              description: "Every run in the last day exited 3 (some source files unreadable) — a path is persistently not being backed up. Check unit logs for the skipped files."

  # The link watchdog only acts while nobody can scrape the host, so every alert
  # here reads a counter after recovery. Bounce and rebind are the same episode
  # escalating, so one series drives both.
  - interval: 1m
    input_series:
      - series: 'link_watchdog_bounce_total{interface="lan0", instance="core-tjoda:9100", host="core-tjoda"}'
        values: "0x60 1x60"
      - series: 'link_watchdog_rebind_total{interface="lan0", instance="core-tjoda:9100", host="core-tjoda"}'
        values: "0x60 1x60"
      - series: 'link_watchdog_carrier_lost_total{interface="lan0", instance="core-tjoda:9100", host="core-tjoda"}'
        values: "0x60 1 2 3 4 5x55"
    alert_rule_test:
      - eval_time: 90m
        alertname: LinkWatchdogBounced
        exp_alerts:
          - exp_labels:
              severity: warning
              interface: lan0
              instance: core-tjoda:9100
              host: core-tjoda
            exp_annotations:
              summary: "core-tjoda: lan0 carrier died and the watchdog bounced it"
              description: "The link dropped and did not come back on its own. The interface bounce recovered it. One is a blip; a pattern means the NIC or the cable is failing."
      - eval_time: 90m
        alertname: LinkWatchdogRebound
        exp_alerts:
          - exp_labels:
              severity: critical
              interface: lan0
              instance: core-tjoda:9100
              host: core-tjoda
            exp_annotations:
              summary: "core-tjoda: lan0 needed a PCI reset to come back"
              description: "Bouncing the interface was not enough; the driver had to be unbound and rebound. Without the watchdog this host would have been unreachable until someone rebooted it. Plan to replace the NIC."
      - eval_time: 90m
        alertname: LinkWatchdogFlapping
        exp_alerts:
          - exp_labels:
              severity: warning
              interface: lan0
              instance: core-tjoda:9100
              host: core-tjoda
            exp_annotations:
              summary: "core-tjoda: lan0 lost carrier repeatedly in 24h"
              description: "The link is unstable rather than failing once. The watchdog is papering over hardware that needs attention."

  # A single bounce must not trip the flapping threshold.
  - interval: 1m
    input_series:
      - series: 'link_watchdog_carrier_lost_total{interface="lan0", instance="core-tjoda:9100", host="core-tjoda"}'
        values: "0x60 1x60"
    alert_rule_test:
      - eval_time: 90m
        alertname: LinkWatchdogFlapping
        exp_alerts: []

  # core.tjoda answering while its watchdog metric is gone: the one thing that
  # recovers this host unattended has stopped, and that must page.
  - interval: 1m
    input_series:
      - series: 'up{job="nodes", instance="core-tjoda:9100", host="core-tjoda"}'
        values: "1x60"
    alert_rule_test:
      - eval_time: 45m
        alertname: LinkWatchdogMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "core.tjoda is up but link_watchdog_carrier is absent"
              description: "The link watchdog timer is not running or its textfile is gone. core.tjoda no longer recovers itself from a dead NIC, and Tjodalyng has no hands."
