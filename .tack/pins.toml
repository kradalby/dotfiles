[tack]
type = "flake"

[shorturls]
gh = "github:{path}"
kra = "gh:kradalby/{path}"
ts = "gh:tailscale/{path}"
nix = "gh:NixOS/nixpkgs/{path}"

# Every input at any depth with these names shares our pin; group and pin
# follows win. Fleet default is unstable: Go services need its go_latest.
[all_follow]
nixpkgs = "nixpkgs-unstable"
nixpkgs-stable = "nixpkgs-stable"
nix-darwin = "darwin"
home-manager = "home-manager"
headscale = "headscale"
flake-utils = "flake-utils"
systems = "flake-utils/systems"
treefmt-nix = "treefmt-nix"
# No top-level pin: tack locks the newest copy found among our pins.
crane = "crane"

[omit_inputs]
names = ["flake-compat"]

# Group names select pins too: `tack look src`, `tack update ai-plugins`.

# Built against the box release (home-manager and the NixOS modules must agree).
[groups.stable]
follows = { nixpkgs = "nixpkgs-stable" }

[groups.ai-plugins]
type = "fetch"

# Package sources built by pkgs/overlays and modules. Go packages keep a
# vendorHash: a bump fails with the new hash.
[groups.src]
type = "fetch"

# grafana.com dashboards. The revisions API is JSON full of numbers, so no tag
# template: bump the revision in the url, then `tack update --accept <pin>`.
[groups.dashboards]
type = "fixed"

## channels

# "stable" tracks the latest NixOS release and is the box default.
[inputs.channels.nixpkgs-stable]
url = "nix:nixos-26.05"

[inputs.channels.nixpkgs-darwin]
url = "nix:nixpkgs-26.05-darwin"

[inputs.channels.nixpkgs-unstable]
url = "nix:nixpkgs-unstable"

[inputs.channels.nixpkgs-master]
url = "nix:master"

## system

[inputs.system.flake-utils]
url = "gh:numtide/flake-utils"

[inputs.system.darwin]
url = "gh:nix-darwin/nix-darwin/nix-darwin-26.05"
follows = { nixpkgs = "nixpkgs-darwin" }

[inputs.system.nix-rosetta-builder]
url = "gh:cpick/nix-rosetta-builder"

# The pin manager itself; nixpkgs lags its releases.
[inputs.system.tack]
url = "gh:manic-systems/tack"
tag = "v{version}"

[inputs.stable.home-manager]
url = "gh:nix-community/home-manager/release-26.05"

[inputs.stable.nix-index-database]
url = "gh:nix-community/nix-index-database"

[inputs.stable.treefmt-nix]
url = "gh:numtide/treefmt-nix"

[inputs.stable.ragenix]
url = "gh:yaxitech/ragenix"

# Stock nixpkgs sd-image-aarch64 has no Pi5 support (no bcm2712 DTB, u-boot,
# or [pi5] config.txt). Its own nixpkgs lacks lib/services, which
# home-manager 26.05 needs.
[inputs.stable.nixos-raspberrypi]
url = "gh:nvmd/nixos-raspberrypi/main"

# Prebuilt Rex. The login server dlopens the host's PAM modules, so keep one
# pam and glibc in the process.
[inputs.stable.rex]
url = "https://pkgs.superlogical.com/rex/nix/snapshot.tar.gz"

