[tack]
type = "flake"

# Every input at any depth with these names shares our pin. Pin and group
# follows win.
[all_follow]
nixpkgs = "nixpkgs-unstable"
nixpkgs-stable = "nixpkgs-stable"
nix-darwin = "darwin"
home-manager = "home-manager"
headscale = "headscale"
flake-utils = "flake-utils"
systems = "flake-utils/systems"
treefmt-nix = "treefmt-nix"
# No top-level pin: tack locks the newest copy found among our pins.
crane = "crane"

[omit_inputs]
names = ["flake-compat"]

[groups.stable]
follows = { nixpkgs = "nixpkgs-stable" }

[shorturls]
gh = "github:{path}"
kra = "gh:kradalby/{path}"
ts = "gh:tailscale/{path}"
nix = "gh:NixOS/nixpkgs/{path}"

## nixpkgs

# "stable" tracks the latest NixOS release and is the box default.
[inputs.nixpkgs-stable]
url = "nix:nixos-26.05"

[inputs.nixpkgs-darwin]
url = "nix:nixpkgs-26.05-darwin"

[inputs.nixpkgs-unstable]
url = "nix:nixpkgs-unstable"

[inputs.nixpkgs-master]
url = "nix:master"

# TODO: remove once nixos-26.05 ships nginx >= 1.30.7 (HTTP/2 RCE fix);
# -small gets it first. Only used by common/nginx.nix.
[inputs.nixpkgs-stable-small]
url = "nix:nixos-26.05-small"

## system

[inputs.flake-utils]
url = "gh:numtide/flake-utils"

[inputs.darwin]
url = "gh:nix-darwin/nix-darwin/nix-darwin-26.05"
follows = { nixpkgs = "nixpkgs-darwin" }

[inputs.home-manager]
url = "gh:nix-community/home-manager/release-26.05"
group = "stable"

[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"
group = "stable"

[inputs.treefmt-nix]
url = "gh:numtide/treefmt-nix"
group = "stable"

[inputs.nix-rosetta-builder]
url = "gh:cpick/nix-rosetta-builder"

[inputs.ragenix]
url = "gh:yaxitech/ragenix"
group = "stable"

# Stock nixpkgs sd-image-aarch64 has no Pi5 support (no bcm2712 DTB, u-boot,
# or [pi5] config.txt). nixos-raspberrypi ships proper Pi5 firmware + sd-image
# generator. Follows the fleet nixpkgs so the Pi build matches home-manager;
# its own pin lacks lib/services, which home-manager 26.05 needs.
[inputs.nixos-raspberrypi]
url = "gh:nvmd/nixos-raspberrypi/main"
group = "stable"

## AI plugin sources: shared by repository, no flake dependencies

[groups.plugins]
type = "fetch"

[inputs.plugins.claude-plugins-official]
url = "gh:anthropics/claude-plugins-official"

[inputs.plugins.claude-superpowers]
url = "gh:obra/superpowers"

[inputs.plugins.claude-ponytail]
url = "gh:DietrichGebert/ponytail"

[inputs.plugins.claude-caveman]
url = "gh:JuliusBrussee/caveman"

[inputs.plugins.claude-ui-ux-pro-max]
url = "gh:nextlevelbuilder/ui-ux-pro-max-skill"

[inputs.plugins.codex-plugin-cc]
url = "gh:openai/codex-plugin-cc"

[inputs.plugins.claude-floorplan]
url = "gh:haydenschmitty/floorplan"

# Pi extension that registers Aperture's /v1/models catalog as providers.
[inputs.plugins.pi-aperture-models]
url = "gh:raggi/aperture-models"

## Go services

[inputs.krapage]
url = "kra:kra"

[inputs.hvor]
url = "kra:hvor"

[inputs.tasmota-exporter]
url = "kra:tasmota-exporter"

[inputs.homewizard-p1-exporter]
url = "kra:homewizard-p1-exporter"

[inputs.ghdl]
url = "kra:ghdl"

# aspargesgaarden.no; branch asparges until it replaces the Pages site on main.
# headscale is only its VM-test control server.
[inputs.asparges]
url = "kra:aspargesgaarden-elm/asparges"

# garnix CI build logs as plain text; runs on the garnix VM as its own tsnet
# node. Follows unstable: its go.mod needs go >= 1.27.0.
[inputs.garnixlogs]
url = "kra:garnixlogs"

# Nix binary cache served over tailscale. Follows unstable: its go.mod needs
# go >= 1.27.0.
[inputs.tsnixcache]
url = "kra:tsnixcache/main"

# Self-hosted garnix CI, held at the reviewed GC and eval fixes so routine
# updates cannot revert them to integration; move it with `tack update
# garnix-ci`. Follows nothing: garnix pins nixpkgs-25.11-small + its own
# nixpkgsUnstable + libkrun for krun; overriding them risks breaking the
# action-runner.
[inputs.garnix-ci]
url = "kra:garnix"
frozen = "f0794f824292f7f6aa7bf36c7e2e74112c290aa3"
exclude_follow = ["*"]

# Upstream builds on unstable but takes its Go from stable; all_follow shares
# both fleet pins.
[inputs.headscale]
url = "gh:juanfont/headscale/main"

# Follows unstable for the fleet-wide go_latest; its go.mod floor is
# satisfied there too.
[inputs.golink]
url = "ts:golink"

[inputs.hugin]
url = "kra:hugin"

# setec-compatible secrets server. Follows unstable so its go build tracks our
# toolchain.
[inputs.ts1p]
url = "kra:ts1p/main"

# Go links changed since the last look. Follows unstable so its go build tracks
# our toolchain.
[inputs.golinkdiff]
url = "kra:golinkdiff/main"

[inputs.tsidp]
url = "ts:tsidp"

[inputs.tailscale]
url = "ts:tailscale/kradalby/nixos-module"

[inputs.munin]
url = "kra:munin"

[inputs.neovim-kradalby]
url = "kra:neovim"

[inputs.nefit-homekit]
url = "kra:nefit-homekit"

[inputs.tasmota-homekit]
url = "kra:tasmota-homekit"

[inputs.z2m-homekit]
url = "kra:z2m-homekit"

## agents

# Hermes patches patchelf for its Linux binaries against its own nixpkgs pin.
[inputs.hermes-agent]
url = "gh:NousResearch/hermes-agent"
follows = { home-manager = "home-manager" }
exclude_follow = ["nixpkgs"]

# Prebuilt Rex. Follows the fleet nixpkgs: the login server dlopens the host's
# PAM modules, so keep one pam and glibc in the process.
[inputs.rex]
url = "https://pkgs.superlogical.com/rex/nix/snapshot.tar.gz"
group = "stable"
