## ci

# Self-hosted garnix CI: our fork of znaniye/garnix-ci (selfhost), held at the
# reviewed GC and eval fixes. The held rev sits on no branch (ahead of
# integration), so `tack update garnix-ci` would drop them; rebase the fork onto
# selfhost first. Follows nothing: garnix pins its own nixpkgs and libkrun for
# krun; overriding them risks breaking the action-runner.
[inputs.ci.garnix-ci]
url = "kra:garnix/integration"
frozen = "f0794f824292f7f6aa7bf36c7e2e74112c290aa3"
exclude_follow = ["*"]

# garnix CI build logs as plain text, on the garnix VM.
[inputs.ci.garnixlogs]
url = "kra:garnixlogs"

# Nix binary cache served over tailscale.
[inputs.ci.tsnixcache]
url = "kra:tsnixcache/main"

## apps

