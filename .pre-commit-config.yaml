# agenix payloads are binary; the whitespace/EOF fixers rewrite them byte for
# byte and break decryption.
exclude: ^secrets/

repos:
  # Prek builtin hooks (fast Rust implementations)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-xml
      - id: mixed-line-ending
      - id: check-symlinks
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-executables-have-shebangs
      # Additional hooks not in prek builtins yet
      - id: check-case-conflict
      - id: check-shebang-scripts-are-executable
      - id: destroyed-symlinks

  # All formatting (nix/markdown/shell) runs through treefmt; its config lives
  # in flake.nix. `nix fmt`, not the devShell's treefmt, so the hook still runs
  # where direnv has not loaded: a blocked .envrc or a fresh worktree.
  - repo: local
    hooks:
      - id: treefmt
        name: treefmt
        entry: nix fmt -- --fail-on-change
        language: system
        pass_filenames: false

  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.12
    hooks:
      - id: shellcheck
